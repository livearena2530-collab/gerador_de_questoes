<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA META TAGS MÁGICAS (Faz o navegador sugerir a instalação) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <title>ProEstudos - Concursos 4.0</title>
    
    <!-- 🔗 Link para o Manifest (Gerado via JS dinâmico abaixo) -->
    <link id="pwa-manifest" rel="manifest" href="">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        // Mágica PWA: Gerando o Manifest.json diretamente pelo Frontend sem precisar de arquivo novo
        const manifestData = {
            "name": "ProEstudos 4.0",
            "short_name": "ProEstudos",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#4f46e5",
            "description": "Plataforma de IA para Concursos",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>",
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

        // Mágica PWA: Gerando o Service Worker (Faz o celular aceitar a instalação)
        const swCode = `
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', (e) => {});
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW ERRO:', err));
        }

        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .perfil-card { transition: all 0.2s ease; }
        .perfil-card:hover { transform: scale(1.05); }
        .perfil-card:hover .perfil-avatar { border: 3px solid white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        
        .ai-brain { background: linear-gradient(135deg, #4f46e5, #ec4899); background-clip: text; -webkit-background-clip: text; color: transparent; }
        mark { background-color: #fde047; color: #0f172a; border-radius: 4px; padding: 0 4px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 font-sans h-[100dvh] flex overflow-hidden">

    <!-- 🍿 TELA DE PERFIS (ESTILO NETFLIX) -->
    <div id="tela-perfis" class="fixed inset-0 bg-[#141414] z-[100] flex flex-col items-center justify-center text-white p-4">
        <h1 class="text-3xl md:text-5xl font-black mb-12 tracking-tight text-center">Quem está estudando?</h1>
        
        <div id="lista-perfis-netflix" class="flex flex-wrap justify-center gap-6 md:gap-8 max-w-4xl mx-auto">
            <!-- Perfis serão injetados aqui -->
        </div>

        <button onclick="abrirModalNovoPerfil()" class="mt-12 px-6 py-3 border border-slate-600 text-slate-400 font-bold hover:text-white hover:border-white transition uppercase tracking-widest text-sm">
            Gerenciar Perfis
        </button>
    </div>

    <!-- TELA PRINCIPAL (APP) -->
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <aside id="sidebar" class="w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col fixed md:relative h-[100dvh] z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shrink-0">
        <div class="p-6 border-b border-slate-200 dark:border-slate-800 shrink-0 flex justify-between items-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition" onclick="voltarParaPerfis()">
            <div class="flex items-center gap-3">
                <div id="sidebar-avatar-bg" class="w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white/20">
                    <i id="sidebar-avatar-icon" class="ph-bold text-2xl"></i>
                </div>
                <div class="min-w-0">
                    <h1 id="sidebar-nome" class="text-lg font-black tracking-tight text-slate-900 dark:text-white truncate">ProEstudos</h1>
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Trocar Perfil <i class="ph-bold ph-arrows-left-right"></i></p>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-1" id="menu-disciplinas">
            <button onclick="carregarPainel()" class="w-full flex items-center gap-3 px-4 py-3 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-400 font-bold rounded-xl transition-colors">
                <i class="ph-bold ph-chart-pie-slice text-xl"></i> Dashboards
            </button>
            <button onclick="iniciarCadernoDeErros()" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-rose-50 dark:hover:bg-rose-900/20 text-slate-700 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400 font-bold rounded-xl transition-colors mt-2 border border-slate-200 dark:border-slate-800 hover:border-rose-200 dark:hover:border-rose-800">
                <i class="ph-bold ph-book-open text-xl text-rose-500"></i> Caderno de Erros
            </button>
            <div class="pt-4 pb-2 px-2 text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider flex justify-between items-center">
                <span>Disciplinas</span>
                <button onclick="abrirModalNovaDisciplina()" class="hover:text-indigo-600 transition" title="Adicionar Disciplina"><i class="ph-bold ph-plus text-lg"></i></button>
            </div>
            <div id="lista-disciplinas-menu" class="space-y-1"></div>
        </div>

        <div class="p-4 border-t border-slate-200 dark:border-slate-800 space-y-2 shrink-0 bg-white dark:bg-slate-900">
            <button onclick="abrirModalIA()" class="w-full flex items-center justify-center gap-2 px-4 py-3.5 bg-slate-900 dark:bg-indigo-600 text-white font-bold rounded-xl hover:bg-slate-800 transition shadow-md active:scale-[0.98]">
                <i class="ph-fill ph-magic-wand text-xl text-yellow-400"></i> Gerar via IA
            </button>
            <button onclick="abrirModalConfig()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 transition">
                <i class="ph-bold ph-gear"></i> Config
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-[100dvh] min-w-0 overflow-hidden relative">
        <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shrink-0 shadow-sm">
            <div class="flex items-center gap-3 min-w-0 flex-1 pr-2">
                <button onclick="toggleSidebar()" class="md:hidden w-10 h-10 flex items-center justify-center text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 rounded-xl"><i class="ph-bold ph-list text-2xl"></i></button>
                <h2 id="header-title" class="text-lg md:text-xl font-black truncate dark:text-white">Painel Geral</h2>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <div class="flex items-center gap-1.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white px-3 py-2 rounded-xl shadow-md font-bold text-sm shrink-0">
                    <i class="ph-fill ph-fire text-lg animate-pulse"></i>
                    <span id="streak-counter" class="hidden sm:inline">0 dias</span>
                </div>
            </div>
        </header>

        <div id="barra-pressao" class="hidden bg-slate-900 text-white p-3 flex justify-between items-center shadow-lg z-10 shrink-0 border-b-4 border-rose-500">
            <div class="flex items-center gap-2 font-black text-rose-400 animate-pulse"><i class="ph-fill ph-timer text-2xl"></i> <span id="timer-display" class="text-xl">00:00:00</span></div>
            <button onclick="finalizarModoPressao()" class="bg-rose-500 hover:bg-rose-600 px-4 py-2 rounded-xl font-bold">Finalizar</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8" id="main-scroll">
            <div class="max-w-4xl mx-auto" id="conteudo-principal"></div>
        </div>
        
        <div id="loading-ia" class="hidden absolute inset-0 bg-white/95 dark:bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center">
            <i class="ph-fill ph-brain text-7xl ai-brain animate-pulse mb-6"></i>
            <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-2">Trabalhando...</h3>
            <p class="text-slate-500 font-medium text-center">Conectando ao modelo de Inteligência Artificial.</p>
        </div>
    </main>

    <!-- Modais -->
    <div id="modal-novo-perfil" class="fixed inset-0 bg-black/90 z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-900 rounded-3xl w-full max-w-sm p-8 border border-slate-700 text-center">
            <h3 class="text-white text-2xl font-black mb-6">Adicionar Perfil</h3>
            <div class="w-24 h-24 mx-auto bg-slate-800 rounded-xl mb-6 flex items-center justify-center text-4xl text-slate-500" id="preview-avatar">
                <i class="ph-bold ph-user"></i>
            </div>
            <input type="text" id="nome-novo-perfil" placeholder="Nome" class="w-full bg-slate-800 text-white border border-slate-700 rounded-xl px-4 py-3 outline-none text-center font-bold mb-6">
            <div class="flex gap-2">
                <button onclick="fecharModal('modal-novo-perfil')" class="flex-1 py-3 text-slate-400 font-bold border border-slate-700 rounded-xl hover:text-white">Cancelar</button>
                <button onclick="salvarNovoPerfil()" class="flex-1 py-3 bg-white text-black font-black rounded-xl">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modais Genéricos HTML Omitidos para poupar espaço, mantidos idênticos (modal-ia, config, disciplina) -->
    <div id="modal-ia" class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90dvh]">
            <div class="p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                <h3 class="font-extrabold text-lg flex items-center gap-2 dark:text-white"><i class="ph-fill ph-magic-wand text-indigo-500"></i> Gerador IA</h3>
                <button onclick="fecharModal('modal-ia')" class="text-slate-400 p-2"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto flex-1">
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Disciplina</label>
                <select id="ia-disciplina" class="w-full bg-slate-50 dark:bg-slate-950 border rounded-xl px-4 py-3 dark:text-white mb-4"></select>
                
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Concurso / Órgão Alvo</label>
                <select id="ia-orgao" class="w-full bg-slate-50 dark:bg-slate-950 border border-indigo-400 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white mb-4">
                    <option value="">Geral</option>
                    <optgroup label="Carreiras Educacionais">
                        <option value="SEDUC - Professor">SEDUC - Professor</option>
                        <option value="SEMEC - Pedagogo">SEMEC - Pedagogo</option>
                    </optgroup>
                    <optgroup label="Segurança Pública">
                        <option value="Polícia Civil (PC)">Polícia Civil (PC)</option>
                        <option value="Polícia Militar (PM)">Polícia Militar (PM)</option>
                    </optgroup>
                    <optgroup label="Tribunais">
                        <option value="Tribunal de Justiça (TJ)">Tribunal de Justiça (TJ)</option>
                        <option value="TSE Unificado">TSE Unificado</option>
                    </optgroup>
                </select>
                <button onclick="gerarQuestoes()" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl mt-4">Iniciar Busca</button>
            </div>
        </div>
    </div>
    
    <div id="modal-config" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 rounded-3xl w-full max-w-sm p-6 border border-slate-700">
            <h3 class="text-white font-bold mb-4">Configurações</h3>
            <button onclick="resetarBanco()" class="w-full py-3 bg-rose-900/30 text-rose-500 font-bold rounded-xl border border-rose-900 mb-3">Zerar Banco de Dados</button>
            <button onclick="fecharModal('modal-config')" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl">Voltar</button>
        </div>
    </div>

    <script>
        // O link real do Render
        const API_BASE_URL = 'https://proestudos-api.onrender.com'; 
        
        let state = {
            perfilId: null, perfilObj: null, perfis: [],
            disciplinas: [], disciplinaAtual: null, filtroAtual: 'todas', questoes: [], stats: {},
            modoPressao: false, respostasPressao: {}, tempoRestante: 0, timerInterval: null
        };
        let chartEvolucao = null; let chartPizza = null;

        // O SEGREDO DO PWA: Verifica se o tema escuro já está ativado para PWA
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.add('dark'); // Forçando dark mode estilo Netflix
        }

        async function api(endpoint, method = 'GET', body = null) {
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) options.body = JSON.stringify(body);
                const res = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!res.ok) throw new Error(await res.text());
                return await res.json();
            } catch (e) { alert("Servidor offline ou carregando. Tente novamente em alguns segundos."); return null; }
        }

        function abrirModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function fecharModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('overlay').classList.toggle('hidden'); }
        
        // --- LÓGICA DE PERFIS (NETFLIX) ---
        const listaAvatares = ['ph-student', 'ph-user-astronaut', 'ph-ninja', 'ph-detective', 'ph-alien'];
        const listaCores = ['bg-rose-500', 'bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500'];

        async function initPerfis() {
            const perfisDB = await api('/api/perfis');
            state.perfis = perfisDB || [];
            
            const salvo = localStorage.getItem('proestudos_perfil');
            if (salvo && state.perfis.find(p => p.id == salvo)) {
                entrarNoPerfil(state.perfis.find(p => p.id == salvo));
            } else {
                renderizarTelaPerfis();
            }
        }

        function renderizarTelaPerfis() {
            document.getElementById('tela-perfis').classList.remove('hidden');
            const container = document.getElementById('lista-perfis-netflix');
            
            let html = state.perfis.map(p => `
                <div class="perfil-card cursor-pointer group flex flex-col items-center gap-3 w-28 md:w-36" onclick='entrarNoPerfil(${JSON.stringify(p)})'>
                    <div class="perfil-avatar w-24 h-24 md:w-36 md:h-36 ${p.cor} rounded-2xl md:rounded-3xl flex items-center justify-center text-white border-4 border-transparent transition-all">
                        <i class="ph-fill ${p.avatar} text-5xl md:text-7xl"></i>
                    </div>
                    <span class="text-slate-400 group-hover:text-white font-bold text-sm md:text-base tracking-wide">${p.nome}</span>
                </div>
            `).join('');

            html += `
                <div class="perfil-card cursor-pointer group flex flex-col items-center gap-3 w-28 md:w-36" onclick="abrirModalNovoPerfil()">
                    <div class="w-24 h-24 md:w-36 md:h-36 bg-transparent border-2 border-dashed border-slate-600 rounded-2xl md:rounded-3xl flex items-center justify-center text-slate-500 group-hover:border-white group-hover:text-white transition-all">
                        <i class="ph-bold ph-plus text-5xl md:text-7xl"></i>
                    </div>
                    <span class="text-slate-500 group-hover:text-white font-bold text-sm md:text-base tracking-wide">Novo Perfil</span>
                </div>
            `;
            container.innerHTML = html;
        }

        function abrirModalNovoPerfil() {
            abrirModal('modal-novo-perfil');
            const icon = listaAvatares[Math.floor(Math.random() * listaAvatares.length)];
            const cor = listaCores[Math.floor(Math.random() * listaCores.length)];
            const preview = document.getElementById('preview-avatar');
            preview.className = `w-24 h-24 mx-auto rounded-xl mb-6 flex items-center justify-center text-4xl text-white ${cor}`;
            preview.innerHTML = `<i class="ph-fill ${icon}"></i>`;
            preview.dataset.icon = icon;
            preview.dataset.cor = cor;
        }

        async function salvarNovoPerfil() {
            const nome = document.getElementById('nome-novo-perfil').value;
            if(!nome) return;
            const preview = document.getElementById('preview-avatar');
            const res = await api('/api/perfis', 'POST', {nome: nome, avatar: preview.dataset.icon, cor: preview.dataset.cor});
            if(res) {
                fecharModal('modal-novo-perfil');
                document.getElementById('nome-novo-perfil').value = '';
                state.perfis.push(res);
                entrarNoPerfil(res);
            }
        }

        async function entrarNoPerfil(perfil) {
            state.perfilId = perfil.id;
            state.perfilObj = perfil;
            localStorage.setItem('proestudos_perfil', perfil.id);
            
            // Atualiza Sidebar
            document.getElementById('sidebar-avatar-bg').className = `w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white/20 ${perfil.cor}`;
            document.getElementById('sidebar-avatar-icon').className = `ph-fill ${perfil.avatar} text-2xl`;
            document.getElementById('sidebar-nome').innerText = perfil.nome;

            document.getElementById('tela-perfis').classList.add('hidden');
            await initApp();
        }

        function voltarParaPerfis() {
            localStorage.removeItem('proestudos_perfil');
            renderizarTelaPerfis();
        }

        // --- SISTEMA PRINCIPAL ---
        async function initApp() {
            const data = await api(`/api/dados?perfil_id=${state.perfilId}`);
            if(!data) return;
            state.disciplinas = data.disciplinas; state.stats = data.stats;
            document.getElementById('streak-counter').innerText = `${state.stats.streak} dias`;
            
            document.getElementById('lista-disciplinas-menu').innerHTML = state.disciplinas.map(d => `
                <button onclick="carregarMateria(${d.id})" class="w-full text-left px-4 py-2.5 rounded-xl font-bold transition text-slate-400 hover:bg-slate-800">
                    <span class="truncate">${d.nome}</span>
                </button>
            `).join('');
            
            carregarPainel();
        }

        async function carregarPainel() {
            state.disciplinaAtual = null;
            let query = `/api/questoes?perfil_id=${state.perfilId}&limit=50`;
            if(state.filtroAtual === 'pendentes') query += `&apenas_pendentes=true`;
            if(state.filtroAtual === 'erros') query += `&apenas_erros=true`;
            if(state.filtroAtual === 'acertos') query += `&apenas_acertos=true`;
            state.questoes = await api(query) || [];
            const data = await api(`/api/dados?perfil_id=${state.perfilId}`); if(data) state.stats = data.stats;
            
            document.getElementById('header-title').innerText = 'Dashboards';
            document.getElementById('conteudo-principal').innerHTML = `
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col items-center justify-center">
                        <span class="text-slate-400 text-xs font-bold uppercase mb-1">Resolvidas</span>
                        <span class="text-3xl font-black text-white">${state.stats.total}</span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-2xl border border-emerald-900/50 flex flex-col items-center justify-center">
                        <span class="text-emerald-500 text-xs font-bold uppercase mb-1">Acertos</span>
                        <span class="text-3xl font-black text-emerald-400">${state.stats.acertos}</span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-2xl border border-rose-900/50 flex flex-col items-center justify-center">
                        <span class="text-rose-500 text-xs font-bold uppercase mb-1">Erros</span>
                        <span class="text-3xl font-black text-rose-400">${state.stats.erros}</span>
                    </div>
                </div>
                
                <div class="flex gap-2 overflow-x-auto pb-4 mb-4">
                    <button onclick="setFiltro('todas')" class="px-4 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 text-white shrink-0">Todas</button>
                    <button onclick="setFiltro('pendentes')" class="px-4 py-2.5 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 shrink-0">Pendentes</button>
                </div>
                <div id="lista-questoes">${renderListaQuestoes()}</div>
            `;
        }

        async function carregarMateria(id) {
            state.disciplinaAtual = id;
            let query = `/api/questoes?perfil_id=${state.perfilId}&disciplina_id=${id}&limit=50`;
            state.questoes = await api(query) || [];
            const d = state.disciplinas.find(x => x.id === id);
            document.getElementById('header-title').innerText = d ? d.nome : '';
            document.getElementById('conteudo-principal').innerHTML = `<div id="lista-questoes">${renderListaQuestoes()}</div>`;
        }

        function setFiltro(f) { state.filtroAtual = f; if(state.disciplinaAtual) carregarMateria(state.disciplinaAtual); else carregarPainel(); }

        function renderListaQuestoes() {
            if(state.questoes.length === 0) return `<div class="text-center py-12 text-slate-500">Nenhuma questão aqui.</div>`;
            return state.questoes.map(q => {
                return `
                <div class="bg-slate-900 rounded-3xl border border-slate-800 mb-6 p-6">
                    <div class="flex gap-2 mb-4"><span class="bg-slate-800 text-indigo-400 text-xs font-bold px-3 py-1 rounded-lg border border-slate-700">${q.disciplina}</span></div>
                    <p class="text-white font-medium mb-6 whitespace-pre-wrap">${q.enunciado_html || q.enunciado}</p>
                    <div class="space-y-3">
                        ${q.alternativas.map(alt => {
                            const l = alt.charAt(0);
                            let bg = "bg-slate-800 hover:border-indigo-400 text-slate-300";
                            if(q.respondida) {
                                if(l === q.gabarito) bg = "bg-emerald-900/40 border-emerald-500 text-emerald-100";
                                else if (!q.acertou && l === q.resposta_usuario) bg = "bg-rose-900/40 border-rose-500 text-rose-100";
                            }
                            return `<button onclick="selecionarAlt(${q.id}, '${l}')" id="btn_${q.id}_${l}" class="w-full text-left p-4 rounded-xl border border-slate-700 transition ${bg}">${alt}</button>`;
                        }).join('')}
                    </div>
                    ${!q.respondida ? `<button onclick="responder(${q.id})" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl mt-6">Confirmar Resposta</button>` : `<div class="mt-4 p-4 bg-slate-950 rounded-xl border border-slate-800 text-slate-300 text-sm"><strong>Explicação:</strong> ${q.explicacao}</div>`}
                </div>`;
            }).join('');
        }

        window.respostasTmp = {};
        function selecionarAlt(qId, letra) { window.respostasTmp[qId] = letra; document.querySelectorAll(`[id^='btn_${qId}_']`).forEach(b => b.classList.replace('border-indigo-500','border-slate-700')); document.getElementById(`btn_${qId}_${letra}`).classList.replace('border-slate-700','border-indigo-500'); }
        
        async function responder(qId) {
            const resp = window.respostasTmp[qId]; if(!resp) return;
            await api('/api/responder', 'POST', {questao_id: qId, resposta: resp, perfil_id: state.perfilId});
            if(state.disciplinaAtual) carregarMateria(state.disciplinaAtual); else carregarPainel();
        }

        function abrirModalIA() { 
            document.getElementById('ia-disciplina').innerHTML = state.disciplinas.map(d => `<option value="${d.id}">${d.nome}</option>`).join('');
            abrirModal('modal-ia'); 
        }
        async function gerarQuestoes() {
            const id = document.getElementById('ia-disciplina').value;
            fecharModal('modal-ia'); document.getElementById('loading-ia').classList.remove('hidden');
            await api('/api/gerar', 'POST', { disciplina_id: parseInt(id), quantidade: 10, orgao: document.getElementById('ia-orgao').value, tipo: 'reais' });
            document.getElementById('loading-ia').classList.add('hidden'); carregarMateria(parseInt(id));
        }

        function abrirModalConfig() { abrirModal('modal-config'); }
        async function resetarBanco() { if(confirm('Zerar DB?')) { await api('/api/reset_db', 'POST'); initPerfis(); fecharModal('modal-config'); } }

        window.onload = initPerfis;
    </script>
</body>
</html>
